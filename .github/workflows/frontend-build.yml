name: Frontend build

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The current lock has a pre-existing ESLint 10 / react-hooks peer-range mismatch.
      # Keep the install deterministic while the dependency versions are aligned separately.
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production bundle
        run: npm run build
